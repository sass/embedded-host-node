name: CI

defaults:
  run: {shell: bash}

env:
  PROTOC_VERSION: 3.x

permissions: {}

concurrency:
  group: ${{ github.workflow }}-build-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, feature.*]
    tags: ['**']
  pull_request:

jobs:
  static_analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning] zizmorcore/zizmor#2496
          node-version: 'lts/*'
          check-latest: true

      - name: Check out the language repo
        uses: sass/clone-linked-repo@ec2dcd11c5eaec56b64855712372056a14e9614d # v1.0.0
        with: {repo: sass/sass, path: language}

      - run: npm install
      - name: npm run init
        run: |
          npm run init -- --skip-compiler --language-path=language $args

      - run: npm run check

  static_analysis_ci:
    name: Static analysis (GitHub Actions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          persona: pedantic
          advanced-security: false # Fail the GitHub action if Zizmor has findings

  tests:
    name: 'Tests | Node ${{ matrix.node-version }} | ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}-latest

    strategy:
      matrix:
        os: [ubuntu, macos, windows]
        node-version: ['lts/*', 'lts/-1', 'lts/-2']
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning] zizmorcore/zizmor#2496
          node-version: ${{ matrix.node-version }}
          check-latest: true
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with: {sdk: stable}
      - run: dart --version

      - name: Check out Dart Sass
        uses: sass/clone-linked-repo@ec2dcd11c5eaec56b64855712372056a14e9614d # v1.0.0
        with: {repo: sass/dart-sass}

      - name: Check out the language repo
        uses: sass/clone-linked-repo@ec2dcd11c5eaec56b64855712372056a14e9614d # v1.0.0
        with: {repo: sass/sass, path: language}

      - run: npm install
      - name: npm run init
        run: |
          npm run init -- --compiler-path=dart-sass --language-path=language $args

      - run: npm run test
      - run: npm run compile
      - run: node test/after-compile-test.mjs

  sass_spec:
    name: 'JS API Tests | Node ${{ matrix.node_version }} | ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}-latest

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
        node_version: ['lts/*']
        include:
          # Include LTS versions on Ubuntu
          - os: ubuntu
            node_version: lts/-1
          - os: ubuntu
            node_version: lts/-2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with: {sdk: stable}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning] zizmorcore/zizmor#2496
          node-version: "${{ matrix.node_version }}"

      - name: Check out Dart Sass
        uses: sass/clone-linked-repo@ec2dcd11c5eaec56b64855712372056a14e9614d # v1.0.0
        with: {repo: sass/dart-sass}

      - name: Check out the language repo
        uses: sass/clone-linked-repo@ec2dcd11c5eaec56b64855712372056a14e9614d # v1.0.0
        with: {repo: sass/sass, path: language}

      - run: npm install
      - name: npm run init
        run: |
          npm run init -- --compiler-path=dart-sass --language-path=language $args

      - name: Check out sass-spec
        uses: sass/clone-linked-repo@ec2dcd11c5eaec56b64855712372056a14e9614d # v1.0.0
        with: {repo: sass/sass-spec}

      - name: Install sass-spec dependencies
        run: npm install
        working-directory: sass-spec

      - name: Compile
        run: npm run compile

      - name: Run tests
        run: npm run js-api-spec -- --sassPackage .. --sassSassRepo ../language
        working-directory: sass-spec

  deploy_npm:
    needs: [static_analysis, tests, sass_spec]
    if: "github.ref_type == 'tag' && github.event.repository.fork == false"
    permissions:
      id-token: write # Forwarded
    uses: $/.github/workflows/release.yml
